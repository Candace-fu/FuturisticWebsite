<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="双城记">
<meta name="theme-color" content="#F3EADA">
<style>html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}</style>
<title>双城记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: one fixed 390×844 portrait phone screen, scaled to fit any window. Top bar, workshop scene, order, 7×6 board with the printer station, item bar; story plays as dialogue cards. Single paper theme by choice. */
:root{
  --paper:#F3EADA; --card:#FBF6EC; --cell:#FAF4E8; --ink:#4A3324; --ink2:#6E5038; --mute:#8A6A50;
  --line:#DCCBAE; --oak:#C99A5E; --oakd:#9C7244; --teal:#5E8C88; --tealD:#3F6C68; --sage:#9DB089; --clay:#B9694C; --gold:#E3B969;
  --desk:#D9CDB8;
  --f-display:'ZCOOL XiaoWei','Noto Serif SC','Songti SC',serif;
  --f-body:'Noto Serif SC','Songti SC','STSong',serif;
  --f-ui:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;overflow:hidden;
  background:var(--paper);display:flex;flex-direction:column;gap:8px;padding:8px 12px 22px;box-sizing:border-box}
body.framed .stage{border-radius:34px;box-shadow:0 0 0 1px rgba(74,51,36,.18),0 24px 60px rgba(74,51,36,.28)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:80;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .2 .55 0 0 0 -.23'/></filter><rect width='240' height='240' filter='url(%23p)'/></svg>")}

/* top bar */
.bar{flex:none;height:44px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:3px}
.brand span{font-size:12px;letter-spacing:1px;color:var(--ink2);white-space:nowrap}
.when{font-family:var(--f-ui);font-size:12px;color:var(--ink2);padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.coins{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border:1px solid #DCC8A6;border-radius:999px;background:#FFFBF3;font-family:var(--f-ui);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.coins.bump{animation:bump .5s ease}
.iconbtn{width:44px;height:44px;margin-right:-6px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.iconbtn:active{background:rgba(110,74,49,.08)}
.menu{position:absolute;right:12px;top:52px;z-index:40;background:var(--card);border:1px solid #D2BE9C;border-radius:12px;box-shadow:0 10px 24px rgba(74,51,36,.2);padding:6px;display:flex;flex-direction:column;min-width:170px}
.menu button{text-align:left;border:0;background:transparent;font-family:var(--f-ui);font-size:15px;padding:12px 14px;border-radius:8px;cursor:pointer;min-height:44px}
.menu button:active{background:#F4EADA}

/* scene */
.scene{flex:1 1 auto;min-height:0;position:relative;border:1px solid #D2BE9C;border-radius:14px;overflow:hidden;background:#EFE3CC;user-select:none;-webkit-user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .tint{position:absolute;inset:0;pointer-events:none;transition:background 2.4s ease;mix-blend-mode:multiply}
.scene .tag{position:absolute;top:8px;font-family:var(--f-ui);font-size:11px;letter-spacing:1px;padding:3px 8px;background:rgba(251,246,236,.92);border:1px solid var(--line);border-radius:4px;color:var(--ink2)}
.scene .tag.l{left:8px}.scene .tag.r{right:8px}
.scene .tag.r.hot{color:#FBF6EC;background:var(--clay);border-color:var(--clay)}
.scene.ready{cursor:pointer}
#fanB{transform-box:fill-box;transform-origin:center}
.scene.printing #fanB{animation:spin .35s linear infinite}
.scene.ready #bedGlow{animation:glow 1.6s ease-in-out infinite}

/* order */
.orders{flex:none;height:78px}
.order{height:100%;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;animation:fadein .4s ease both}
.order.ready{border-color:var(--tealD);box-shadow:0 0 0 2px rgba(63,108,104,.22);background:#F4F7EF}
.order.over{background:#E4EEE6;border-color:var(--tealD)}
.order .av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:16px;font-weight:500;color:#FBF6EC;background:var(--tealD)}
.order .av.me{background:#7E9470}
.otext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.oname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.otag{font-family:var(--f-ui);font-size:10.5px;font-weight:400;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.oask{font-size:12.5px;color:var(--ink2);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe{display:flex;align-items:center;gap:4px;font-family:var(--f-ui);font-size:11px;color:var(--mute);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:2px;padding:1px 7px 1px 2px;border-radius:999px;background:#F3EBDC;border:1px solid #E1D2B6;color:var(--ink2)}
.chip .spr{width:18px;height:18px}
.chip.ok{background:#E6EFE1;border-color:#C2D3B5;color:#3D5E3A}
.readynote{font-family:var(--f-ui);font-size:12px;color:var(--tealD);font-weight:500}
.owant{flex:none;display:flex;align-items:center;gap:8px}
.wantimg{width:52px;height:52px;border-radius:8px;background:var(--cell);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.wantimg .spr{width:44px;height:44px}
.wantimg.missing .spr{opacity:.35;filter:grayscale(.6)}
.deliver{font-family:var(--f-ui);font-size:13px;font-weight:500;background:var(--tealD);color:#FBF6EC;border:0;border-radius:8px;padding:0 10px;height:44px;cursor:pointer;white-space:nowrap}
.deliver:disabled{display:none}
.orderwait{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* board */
.boardwrap{flex:none;position:relative}
.rim{padding:5px;background:var(--oak);border:1px solid var(--oakd);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,236,200,.6),0 2px 4px rgba(110,74,49,.14)}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:3px;background:#E4D6BD;border-radius:7px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{position:relative;height:45px;border:0;padding:0;margin:0;border-radius:4px;background:var(--cell);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.cell.has{cursor:grab}
.cell>.spr{width:40px;height:40px;pointer-events:none}
.cell.gen{background:#F1E4CB;box-shadow:inset 0 0 0 1px #D9C29A}
.cell.station{background:#E9EFE6;box-shadow:inset 0 0 0 1.5px #A9BCA4}
.cell.station.st-ready{background:#FCEBD6;box-shadow:inset 0 0 0 2px var(--clay)}
.cell.station.st-ready>.spr{animation:jiggle 1s ease-in-out infinite}
.cell.sel{box-shadow:inset 0 0 0 2.5px var(--teal);background:#F1F4EA}
.cell.over{background:#E4EEE6;box-shadow:inset 0 0 0 2px var(--tealD)}
.cell.lifting>.spr{opacity:.25}
.cell.pop>.spr{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.cell.spawn>.spr{animation:spawn .35s cubic-bezier(.3,1.5,.5,1)}
.pips{position:absolute;left:12%;right:12%;bottom:3px;display:flex;gap:2px;pointer-events:none}
.pips i{flex:1;height:3px;border-radius:2px;background:#E2D0AE}
.pips i.on{background:var(--teal)}
.badge{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#5F8B5A;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 0 0 1.5px var(--cell)}
.badge svg{width:9px;height:9px}
.loads{position:absolute;left:2px;right:2px;bottom:2px;display:flex;justify-content:space-between;pointer-events:none}
.ld{width:16px;height:16px;border-radius:3px;background:#FFFCF5;box-shadow:0 0 0 1px #CDBB98;display:flex;align-items:center;justify-content:center}
.ld .spr{width:15px;height:15px}
.ld.empty{background:transparent;box-shadow:inset 0 0 0 1px #A9BCA4}
.ring{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:3.2}
.ring .rbg{stroke:rgba(110,74,49,.14)}
.ring .rfg{stroke:var(--clay);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer{position:absolute;right:-5px;top:-7px;display:flex;align-items:center;gap:2px;padding:1px 5px 1px 3px;border-radius:999px;background:#FFFDF6;border:1px solid #D8C4A0;font-family:var(--f-ui);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums;pointer-events:none;z-index:2;box-shadow:0 1px 3px rgba(74,51,36,.15)}
.timer svg{width:11px;height:11px}
.readytag{position:absolute;right:-5px;top:-7px;padding:0 7px;border-radius:999px;background:var(--clay);color:#FBF6EC;font-family:var(--f-ui);font-size:10.5px;font-weight:500;line-height:17px;pointer-events:none;z-index:2;animation:bob 1s ease-in-out infinite}
.spot::after{content:"";position:absolute;inset:1px;border-radius:5px;box-shadow:0 0 0 2px var(--clay);animation:breathe 1.2s ease-in-out infinite;pointer-events:none}
.deliver.spot{position:relative}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);pointer-events:none;animation:spark .5s ease-out forwards}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;max-width:92%;width:max-content;padding:7px 12px;font-size:13px;line-height:1.5;background:#FFFDF6;border:1px solid #D8C4A0;border-radius:8px;box-shadow:0 3px 8px rgba(74,51,36,.15);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:200;filter:drop-shadow(0 6px 6px rgba(74,51,36,.25))}
.ghost .spr{width:100%;height:100%}

/* item bar */
.info{flex:none;height:60px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.info .thumb{flex:none;width:44px;height:44px;border-radius:8px;background:#F1F4EA;box-shadow:inset 0 0 0 1.5px var(--teal);display:flex;align-items:center;justify-content:center}
.info .thumb .spr{width:36px;height:36px}
.info .itxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.info .iname{font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.info .ilv{font-family:var(--f-ui);font-size:10.5px;font-weight:400;color:var(--mute)}
.info .idesc{font-size:12px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .empty{font-size:13px;color:var(--mute);padding-left:6px}
.sbtn{flex:none;font-family:var(--f-ui);font-size:13px;font-weight:500;border-radius:8px;padding:0 11px;height:40px;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink2)}
.sbtn.p{background:var(--tealD);color:#FBF6EC;border-color:var(--tealD)}

/* dialogue */
.dlg{position:absolute;inset:0;z-index:30;background:rgba(38,25,15,.22);display:flex;align-items:flex-end;padding:0 12px 26px;cursor:pointer}
.dlgcard{width:100%;box-sizing:border-box;background:#FFFDF6;border:1.5px solid #D8C4A0;border-radius:16px;box-shadow:0 10px 28px rgba(38,25,15,.25);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;animation:rise .3s ease both}
.dlgwho{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--ink2)}
.dlgwho .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FBF6EC;background:var(--tealD);font-size:13px}
.dlgwho .av.me{background:#7E9470}
.dlgtext{margin:0;font-size:16px;line-height:1.8;color:var(--ink);min-height:58px}
.dlg.narr .dlgtext{font-size:15.5px;color:var(--ink2)}
.dlgfoot{display:flex;justify-content:flex-end}
.next{font-family:var(--f-ui);font-size:14px;font-weight:500;background:#F4EADA;border:1px solid #D8C4A0;border-radius:999px;padding:0 20px;height:44px;cursor:pointer;color:var(--ink)}

/* people */
.av.pic,.dlgwho .av.pic{background:transparent;overflow:visible;padding:0}
.ava{position:relative;display:block;width:100%;height:100%}
.ava-bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 30%,#FFF6F4 0,#F7D5DB 70%,#EFB9C4 100%);box-shadow:0 0 0 2px #FFFDF8,0 0 0 3.5px var(--ring),0 2px 6px rgba(110,74,49,.25)}
.ava img{position:absolute;left:-6%;bottom:0;width:112%;height:125%;object-fit:cover;object-position:50% 0;
  -webkit-mask-image:linear-gradient(#000 60%,transparent 60%),radial-gradient(44.6% 40% at 50% 60%,#000 98%,transparent 100%);
  mask-image:linear-gradient(#000 60%,transparent 60%),radial-gradient(44.6% 40% at 50% 60%,#000 98%,transparent 100%)}
.ppic .ava,.ppic{overflow:visible}
.ava.free img{position:static;width:100%;height:100%;object-fit:contain;-webkit-mask-image:none;mask-image:none;filter:drop-shadow(0 1px 2px rgba(110,74,49,.25))}
.order .av.pic{width:50px;height:50px}
.ppic .ava.free{width:72px;height:72px;margin:-4px}


.standee{position:absolute;left:50%;bottom:150px;width:330px;height:495px;margin-left:-165px;object-fit:contain;object-position:bottom;pointer-events:none;filter:drop-shadow(0 8px 16px rgba(38,25,15,.25))}
.standee.chibi{width:300px;height:340px;margin-left:-150px;bottom:126px;object-fit:cover;object-position:50% 0}
.meetpic.chibi img{object-fit:contain;object-position:50% 100%}
.standee.in{animation:standin .45s ease both}
@keyframes standin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dlgcard{position:relative;z-index:1}
.meet{align-items:center;text-align:center}
.meetpic{width:210px;height:330px;border-radius:16px;overflow:hidden;background:linear-gradient(#F6E6E3,#F3EADA);box-shadow:0 0 0 3px #FBF6EC,0 0 0 5px #E7A3B3;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.meetpic svg,.meetpic img{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%;padding-top:8px;box-sizing:border-box}
.meetlines{display:flex;flex-direction:column;gap:2px}
.meetlines p{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.meet .primary{align-self:stretch}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FFFCF5}
.pcard.locked{opacity:.75}
.ppic{flex:none;width:64px;height:64px;margin-top:8px;border-radius:50%;overflow:hidden}
.pcard:not(.locked) .ppic{overflow:visible;border-radius:0}
.ppic>svg{width:100%;height:100%;display:block}
.ptxt{display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.ptxt b{font-size:16px;color:var(--ink)}
.plocks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.psecret svg{width:11px;height:11px;flex:none}
.psecret{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;background:#F3EBDC;color:var(--mute);font-family:var(--f-ui);font-size:12px}

/* scene pan */
.scene{touch-action:none;cursor:grab}
.scene.grabbing{cursor:grabbing}
.panhint{position:absolute;left:8px;bottom:8px;font-family:var(--f-ui);font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(74,51,36,.62);color:#FBF6EC;pointer-events:none;transition:opacity .5s}
.panhint.gone{opacity:0}
#deskPhone,#wallCal{cursor:pointer}
.amsin{animation:fadein .7s ease both}
.calmark{stroke-dasharray:60;stroke-dashoffset:0}
.calmark.draw{animation:caldraw 1s .3s ease both}
@keyframes caldraw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cday{position:relative;height:44px;border:1px solid var(--line);border-radius:8px;background:#FFFCF5;font-family:var(--f-ui);font-size:14px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cday:disabled{color:#C9BCA6;background:transparent;cursor:default}
.cday.on{border-color:var(--tealD);box-shadow:0 0 0 2px rgba(63,108,104,.25)}
.cday svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none}
.cday small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--clay)}
.calcap{margin:0;font-family:var(--f-ui);font-size:13px;color:var(--ink2)}
.roomitem.appear{animation:roomin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes roomin{0%{opacity:0;transform:translate(656px,180px) scale(3.3)}100%{opacity:1;transform:translate(656px,204px) scale(3.6)}}
#deskPhone .ping{opacity:0;transform-box:fill-box;transform-origin:center}
#deskPhone.ping-on .ping{animation:phping 1.5s ease-out infinite}
@keyframes phping{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.4)}}

/* tidy */
.tidy{gap:8px}
.tpeg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;border-radius:10px;border:1.5px solid #9C7244;background-color:#D9AE72;
  background-image:radial-gradient(circle at 6px 6px,#A97C4E 1.3px,transparent 1.6px);background-size:12px 12px;touch-action:none}
.ttool{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid #9C7244;border-radius:10px;background:rgba(255,252,244,.92);padding:4px 0 3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:66px}
.ttool .spr{width:42px;height:42px;pointer-events:none}
.ttool span{font-family:var(--f-ui);font-size:11px;color:var(--ink2);pointer-events:none;white-space:nowrap}
.ttool.sel{border-color:var(--tealD);box-shadow:0 0 0 2px rgba(63,108,104,.35);background:#F1F4EA}
.ttool.lifting{opacity:.35}
.ttool.gone{visibility:hidden}
.torg{position:relative;width:330px;height:188px;align-self:center;border:1.5px solid #6E4A31;border-radius:16px;background:#CBC6B8;box-shadow:inset 0 -6px 0 #B5AFA1,0 3px 0 #9E9888}
.tslot{position:absolute;border:1.5px solid #8F8979;border-radius:7px;background:#ABA597;box-shadow:inset 0 3px 4px rgba(60,50,40,.28);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tslot .spr{flex:none;width:58px;height:58px;pointer-events:none}
.tslot.k-long .spr{width:150px;height:150px}
.tslot.k-big .spr{width:160px;height:160px}
.tslot.fit{border-color:var(--tealD);background:#B9C4B4;animation:breathe 1.2s ease-in-out infinite}
.tslot.over{background:#C5D2C0;border-color:var(--tealD)}
.tslot.full{background:#B3AD9F;animation:none}
.tslot.full .spr{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tslot.no{animation:shake .35s ease}

/* tutorial */

.tut-hole::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:3px solid #FFE3B8;animation:breathe 1.1s ease-in-out infinite}
.tut.soft .tut-hole{box-shadow:none}
.tut.soft .tut-block{display:none}
.tut-hole.nudge::after{animation:nudge .4s ease 2}
.tut-arrow{position:absolute;width:48px;height:56px;pointer-events:none}
.tut-arrow svg{width:100%;height:100%;display:block;animation:bobdown .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.tut-arrow.up svg{animation-name:bobup}
.tut-bubble{position:absolute;width:280px;box-sizing:border-box;padding:10px 14px;background:#FFFDF6;border:2px solid #F0C99A;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none;display:flex;flex-direction:column;gap:2px}
.tut-bubble b{font-size:17px;line-height:1.45;text-wrap:balance}
.tut-bubble span{font-size:13px;line-height:1.5;color:var(--ink2)}
.tut-finger{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,253,246,.9);box-shadow:0 0 0 3px var(--clay),0 4px 10px rgba(0,0,0,.3);pointer-events:none;animation:fingerdrag 1.9s ease-in-out infinite}
.tut-skip{position:absolute;top:8px;right:10px;pointer-events:auto;font-family:var(--f-ui);font-size:13px;font-weight:500;color:#FBF6EC;background:rgba(38,25,15,.72);border:1px solid rgba(255,240,215,.5);border-radius:999px;padding:0 14px;height:40px;cursor:pointer;display:flex;align-items:center;gap:6px}

/* sheets */
.modal{position:absolute;inset:0;z-index:50;background:rgba(74,51,36,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-height:100%;box-sizing:border-box;overflow:auto;background:var(--card);border:1px solid #D2BE9C;border-radius:18px;box-shadow:0 18px 40px rgba(74,51,36,.3);padding:18px;display:flex;flex-direction:column;gap:10px;animation:rise .35s ease both}
.eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:3px;color:var(--mute)}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:2px}
#liftSvg{width:100%;height:auto;display:block;border-radius:12px;background:linear-gradient(#F4EAD7,#E9D9BC);touch-action:none;user-select:none;-webkit-user-select:none}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
.steam path:nth-child(3){animation-delay:1.6s}
.lifthint{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.primary{font-family:var(--f-ui);font-size:15px;font-weight:500;background:var(--tealD);color:#FBF6EC;border:0;border-radius:10px;padding:0 20px;height:48px;cursor:pointer;box-shadow:0 2px 0 #2F524F}
.primary:disabled{background:#CFC4B0;color:#7A6A58;box-shadow:none}
.flex{user-select:none;-webkit-user-select:none;touch-action:none;width:100%}
.lifttext{margin:0;font-size:15px;line-height:1.85;animation:fadein .8s ease both}
.row{display:flex;flex-direction:column;gap:8px}
.journal{background:#FFFCF4;background-image:repeating-linear-gradient(transparent 0 31px,#EADFCB 31px 32px);border-radius:8px;padding:6px 14px 10px;border:1px solid #E8DCC6}
.jitem{display:flex;gap:10px;align-items:center;min-height:60px;font-size:14.5px;line-height:1.7}
.jitem .spr{flex:none;width:44px;height:44px}

/* day 2: lift choice, unboxing, AMS tubes, model site, D's chat */
.liftpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary.alt{background:#FFFDF6;color:var(--tealD);border:1.5px solid var(--tealD);box-shadow:0 2px 0 #C9D6CF}
.ubox{position:relative;min-height:150px;border-radius:12px;background:#C99A5E;border:1.5px solid #6E4A31;box-shadow:inset 0 -8px 0 #B08350;display:flex;align-items:center;justify-content:center}
.utape{position:absolute;left:0;right:0;top:50%;height:22px;margin-top:-11px;background:rgba(240,226,190,.85);border-top:1px dashed #9C7244;border-bottom:1px dashed #9C7244}
.ubox .primary{position:relative}
.ugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;width:100%;box-sizing:border-box}
.uspool{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid #9C7244;border-radius:10px;background:#E9D3AE;padding:6px 0 5px;cursor:pointer;font-family:var(--f-ui);font-size:11.5px;color:var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) backwards}
.uspool .spr{width:54px;height:54px;pointer-events:none}
.uspool small{font-size:10px;color:var(--mute)}
.uspool.gone{visibility:hidden}
.urack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px;border-radius:10px;background:#D9AE72;border:1.5px solid #9C7244}
.urack i{height:58px;border-radius:8px;border:1.5px dashed #9C7244;display:flex;align-items:center;justify-content:center}
.urack i .spr{width:50px;height:50px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#amsSvg{width:100%;height:auto;display:block;border-radius:12px;background:linear-gradient(#F4EAD7,#E9D9BC);touch-action:manipulation}
#amsSvg .aport{cursor:pointer}
.feed{stroke-dasharray:100;stroke-dashoffset:100;animation:feed 1.4s ease forwards}
.feed.bad{animation:feedbad 1.4s ease forwards}
@keyframes feed{to{stroke-dashoffset:0}}
@keyframes feedbad{60%{stroke-dashoffset:62}100%{stroke-dashoffset:64}}
.stuck{opacity:0;animation:fadein .3s 1.1s ease forwards}
.atray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.atube{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border:1.5px solid #CDB893;border-radius:10px;background:#FFFDF6;cursor:pointer;font-family:var(--f-ui);font-size:12.5px;color:var(--ink2);box-shadow:0 2px 0 #E0D0B4}
.atube svg{flex:none;height:12px}
.atube.sel{border-color:var(--tealD);box-shadow:0 0 0 2px rgba(63,108,104,.3);background:#F1F4EA}
.atube.used{visibility:hidden}
.s-url{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;background:#F1E8D8;border:1px solid #E3D6BF;font-family:var(--f-ui);font-size:13px;color:var(--ink2)}
.s-url svg{width:13px;height:13px}
.s-card{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#FFFCF5}
.s-card .spr{flex:none;width:52px;height:52px}
.s-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.s-txt b{font-size:15px}
.s-txt span{font-size:12px;color:var(--ink2);line-height:1.5}
.s-data{font-family:var(--f-ui);font-size:11px;color:var(--tealD)}
.s-data.todo{color:var(--clay)}
.s-go{flex:none;font-family:var(--f-ui);font-size:13px;font-weight:500;height:40px;padding:0 12px;border-radius:8px;border:0;background:var(--tealD);color:#FBF6EC;cursor:pointer;white-space:nowrap}
.s-go:disabled{background:#E4DACA;color:#8A7A66;cursor:default}
.ch-avd{filter:none;background:transparent;border:0;overflow:visible}
.ch-avd .ava{width:34px;height:34px}
.ch-stk{padding:2px!important;background:transparent!important;border:0!important}
.ch-stk svg{width:88px;height:88px;display:block}
#lapScreen .blueprint *{fill:none!important;stroke:#5E8C88!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes spawn{0%{transform:scale(.3) translateY(8px);opacity:.3}100%{transform:none;opacity:1}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes jiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-2px)}75%{transform:rotate(4deg) translateY(-2px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bobdown{0%,100%{transform:translateY(-5px)}50%{transform:translateY(4px)}}
@keyframes bobup{0%,100%{transform:rotate(180deg) translateY(-5px)}50%{transform:rotate(180deg) translateY(4px)}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fingerdrag{
  0%{transform:translate(var(--x0),var(--y0)) scale(1.15);opacity:0}
  12%{transform:translate(var(--x0),var(--y0)) scale(.82);opacity:1}
  70%{transform:translate(var(--x1),var(--y1)) scale(.82);opacity:1}
  84%{transform:translate(var(--x1),var(--y1)) scale(1.15);opacity:0}
  100%{transform:translate(var(--x1),var(--y1)) scale(1.15);opacity:0}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (prefers-reduced-motion:reduce){.tut-finger{animation:none!important;transform:translate(var(--x0),var(--y0))}}

    const a = ctx(); if (!a || muted) return;

    wake() { ctx(); },
    spawn() { tone(620, .1, 'triangle', .05, 880); },
    merge(lv) { const f = 360 + lv * 110; tone(f, .18, 'triangle', .08, f * 1.6); tone(f * 3, .09, 'sine', .025, null, .05); },
    place() { tone(250, .09, 'triangle', .06, 170); },

  const v1 = viewSize();
  SV.x = ux - (cx - v1.r.left - v1.r.width / 2) * v1.vw / v1.r.width;
  SV.y = uy - (cy - v1.r.top - v1.r.height / 2) * v1.vh / v1.r.height;
  applyView();
}
const PANKEY = 'shuangchengji-panned';
function panHintDone() { $('#panHint').classList.add('gone'); try { localStorage.setItem(PANKEY, '1'); } catch (e) {} }
try { if (localStorage.getItem(PANKEY) === '1') $('#panHint').classList.add('gone'); } catch (e) {}
const ptrs = new Map(); let panMoved = false, pinch0 = null;
sceneEl.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) panMoved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), z: SV.z }; }
  try { sceneEl.setPointerCapture(e.pointerId); } catch (x) {}
});
sceneEl.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2 && pinch0) {
    const [a, b] = [...ptrs.values()];
    zoomAt(pinch0.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch0.d), (a.x + b.x) / 2, (a.y + b.y) / 2);
    panMoved = true; return;
  }
  if (!panMoved && Math.abs(dx) + Math.abs(dy) < 1) return;
  const v = viewSize(); if (!v) return;
  if (!panMoved) { p.sx = (p.sx || 0) + Math.abs(dx) + Math.abs(dy); if (p.sx < 5) return; panMoved = true; panHintDone(); sceneEl.classList.add('grabbing'); }
  SV.x -= dx * v.vw / v.r.width; SV.y -= dy * v.vh / v.r.height; applyView();
});
function endPtr(e) { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; if (!ptrs.size) sceneEl.classList.remove('grabbing'); }
sceneEl.addEventListener('pointerup', endPtr); sceneEl.addEventListener('pointercancel', endPtr);
sceneEl.addEventListener('wheel', e => { e.preventDefault(); zoomAt(SV.z * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); panHintDone(); }, { passive: false });
sceneEl.addEventListener('dblclick', e => { zoomAt(SV.z > 1.3 ? 1 : 1.9, e.clientX, e.clientY); panHintDone(); });
window.addEventListener('resize', applyView);
requestAnimationFrame(applyView);

/* ---------- people ---------- */
function openMeet(who) {
  st.met[who] = true;
  const p = PEOPLE.find(x => x.id === who);
  $('#meetPic').innerHTML = standeeOf(who + '_sketch') ? '<img src="' + standeeOf(who + '_sketch') + '" alt="">' : PORTRAIT[who];
  $('#meetName').textContent = p.name;
  $('#meetLines').innerHTML = p.lines.map(t => '<p>' + t + '</p>').join('');
  $('#meetModal').hidden = false; sfx.chime(); updateGuide();
}
$('#meetOk').addEventListener('click', () => { $('#meetModal').hidden = true; step(); });
$('#peopleClose').addEventListener('click', () => { $('#peopleModal').hidden = true; updateGuide(); });
/* ---------- journal ---------- */
function journalItems() {
  return st.day === 2 ? st.jr : st.done.map(k => ({ spr: k === 'org' && st.room.tidy ? 'org_full' : k, t: JOURNAL[k] }));
}
function openJournal() {
  const items = journalItems();
  st.dayDone = true; saveDiary(); renderCal(true);
  $('#jTitle').textContent = '杭州 · ' + DAYNAME[st.day];
  $('#journalBody').innerHTML = items.map(x => '<div class="jitem">' + spr(x.spr) + '<span>' + x.t + '</span></div>').join('') +
    (st.day === 1 && st.room.tidy ? '<p class="jnote">明天：抽空搞一把刮刀。</p>' : '');
  const nb = $('#nextDayBtn');
  nb.textContent = st.day === 1 ? '第二天' : '第三天（制作中）'; nb.disabled = st.day !== 1;
  $('#journalModal').hidden = false; updateGuide();
}
/* ---------- wall calendar: a circle for each finished day, tap a day to read its diary ---------- */
const DIARY_KEY = 'shuangchengji-diary-';
const DIARY_DEFAULT = { 1: [{ spr: 'bm1', t: JOURNAL.bm1 }, { spr: 'org_full', t: JOURNAL.org }] };
const CIRCLE = (cx, cy, rx, ry) => '<path d="M' + (cx - rx) + ' ' + (cy + 1) + ' A' + rx + ' ' + ry + ' 0 1 1 ' + (cx - rx + 2) + ' ' + (cy + ry * .8) + '" class="calmark" fill="none" stroke="#B9694C" stroke-width="1.1" pathLength="60"></path>';
function saveDiary() { try { localStorage.setItem(DIARY_KEY + st.day, JSON.stringify(journalItems())); } catch (e) {} }
function diaryOf(d) {
  if (d === st.day) return journalItems();
  try { const v = JSON.parse(localStorage.getItem(DIARY_KEY + d)); if (v && v.length) return v; } catch (e) {}
  return DIARY_DEFAULT[d] || [];
}
const dayDone = d => d < st.day || (d === st.day && st.dayDone);
function renderCal(anim) {
  let h = '';
  for (let d = 1; d <= 12; d++) {
    const x = 399 + (d - 1) % 4 * 11, y = 127 + Math.floor((d - 1) / 4) * 12;
    if (dayDone(d)) h += CIRCLE(x, y, 4.6, 4.2).replace('class="calmark"', 'class="calmark' + (anim && d === st.day ? ' draw' : '') + '"');
    else if (d === st.day) h += '<rect x="' + (x - 4.4) + '" y="' + (y - 4.6) + '" width="8.8" height="8.4" rx="1.5" fill="none" stroke="#5E8C88" stroke-width=".9" stroke-dasharray="1.6 1.2"></rect>';
  }
  $('#calMarks').innerHTML = h;
}
function openCal(sel) {
  sel = sel || st.day;
  let g = '';
  for (let d = 1; d <= 14; d++) {
    const can = d <= st.day;
    g += '<button type="button" class="cday' + (d === sel ? ' on' : '') + '" data-d="' + d + '"' + (can ? '' : ' disabled') + '>' + d +
      (dayDone(d) ? '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 22 A14 13 0 1 1 10 30" fill="none" stroke="#B9694C" stroke-width="2" stroke-linecap="round"></path></svg>' : '') +
      (d === st.day ? '<small>今天</small>' : '') + '</button>';
  }
  $('#calGrid').innerHTML = g;
  const items = diaryOf(sel);
  $('#calCap').textContent = DAYNAME[sel] ? '杭州 · ' + DAYNAME[sel] : '第 ' + sel + ' 天';
  $('#calDiary').innerHTML = items.length ? items.map(x => '<div class="jitem">' + spr(x.spr) + '<span>' + x.t + '</span></div>').join('') : '<div class="jitem"><span>' + (sel === st.day ? '今天还没有记下什么。' : '这一天的日记还空着。') + '</span></div>';
  $('#calGrid').querySelectorAll('.cday:not([disabled])').forEach(b => b.addEventListener('click', () => { sfx.soft(); openCal(+b.dataset.d); }));
  $('#calModal').hidden = false; updateGuide();
}
$('#calClose').addEventListener('click', () => { $('#calModal').hidden = true; updateGuide(); });
$('#againBtn').addEventListener('click', () => { $('#journalModal').hidden = true; start(st.day); });
$('#nextDayBtn').addEventListener('click', () => { if (st.day !== 1) return; $('#journalModal').hidden = true; start(2, st.coins); });

/* ---------- menu ---------- */
const menu = $('#menu'), menuBtn = $('#menuBtn');
function toggleMenu(v) { menu.hidden = !v; menuBtn.setAttribute('aria-expanded', String(v)); }
menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleMenu(menu.hidden); });
stage.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== menuBtn) toggleMenu(false); });
$('#muteBtn').addEventListener('click', e => { const m = sfx.toggle(); e.currentTarget.textContent = '声音：' + (m ? '关' : '开'); toggleMenu(false); });
$('#tutBtn').addEventListener('click', () => { toggleMenu(false); markTutDone(false); start(1); });
$('#restartBtn').addEventListener('click', () => { toggleMenu(false); start(st.day); });
$('#dayBtn').addEventListener('click', () => { toggleMenu(false); start(st.day === 1 ? 2 : 1); });
$('#peopleBtn').addEventListener('click', () => { toggleMenu(false); openPeople(); });
function artLabel() { $('#artBtn').textContent = '人物画风：' + (ART === 'chibi' ? 'Q 版' : '半身'); $('#standee').classList.toggle('chibi', ART === 'chibi'); }
$('#artBtn').addEventListener('click', () => {
  ART = ART === 'chibi' ? 'half' : 'chibi';
  try { localStorage.setItem('shuangchengji-art', ART); } catch (e) {}
  artLabel(); toggleMenu(false);
  const sd = $('#standee'); if (sd.dataset.who && standeeOf(sd.dataset.who)) sd.src = standeeOf(sd.dataset.who);
  if (!$('#meetModal').hidden) $('#meetPic').innerHTML = '<img src="' + standeeOf('D_sketch') + '" alt="">';
  if (!$('#peopleModal').hidden) openPeople();
  renderOrders();
});
artLabel();

setInterval(() => {
  if (!st) return; let ch = false;
  Object.values(st.gens).forEach(g => { if (g.c < GMAX) { g.t += 250; if (g.t >= GREGEN) { g.c++; g.t = 0; ch = true; } } });
  if (ch) { updatePips(); if (st.tut) updateGuide(); }
}, 250);

function start(day, coins) {
  day = day === 2 ? 2 : 1;
  cancelAnimationFrame(printRaf); cancelAnimationFrame(L.raf); sfx.humStop();
  document.querySelectorAll('.modal').forEach(m => { m.hidden = true; }); $('#notif').hidden = true; phoneStory = false;
  ORDERS = day === 2 ? ORDERS2 : ORDERS1; POST = day === 2 ? POST2 : POST1; ORDERS2[1] = null;
  st = freshDay(day, coins); renderDeskPhone(); renderRoom(); SV.x = 320; SV.y = 210; SV.z = 1; applyView(); Q = [];
  $('#dayText').textContent = '杭州 · ' + DAYNAME[day];
  setLaptop(day === 2 ? 'org_full' : null); renderCal();
  $('#dayBtn').textContent = day === 1 ? '去第二天' : '回到第一天';
  $('#coinText').textContent = st.coins;
  setGrow(0); setHead(0, 0); G.glow.setAttribute('opacity', '0'); G.lcd.textContent = '待命';
  $('#scene').classList.remove('printing');
  setTime('morning');
  renderBoard();
  queue(day === 2 ? INTRO2 : INTRO);
}
start(location.hash === '#day2' ? 2 : 1);
})();
</script>
