name: Deploy pills.fun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pills-fun-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy and verify website
        env:
          DEPLOY_KEY: ${{ secrets.PILLS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PILLS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/pills-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            web@pills.fun "deploy-main $DEPLOY_SHA"
